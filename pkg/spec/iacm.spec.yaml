spec_version: 1
module_type: builtin
module_desc: Infrastructure as Code Management (workspaces, resources)
help_text: |
  ## Infrastructure as Code Management (iacm)

  Harness IACM manages Terraform, OpenTofu and AWS CDK infrastructure lifecycles. It tracks
  workspace state, runs plans and applies, and provides drift detection and cost
  estimation across your infrastructure.

  ### Domain Model

  A workspace is the core unit — it maps to a Terraform workspace with a specific
  backend, variables, and state. Workspaces run operations (plan, apply, destroy)
  which produce execution logs and state snapshots.

  ### State operations

  Every command that runs inside a workspace takes `--workspace <id>`. When that
  flag is omitted, the command reads `.harness/workspace.yaml` in the current
  directory (`workspace_id`, and optional `org_id` / `project_id`).

  `list state` and `get state` download the stored state file and read it in the CLI. Mutations run through the
  workspace state pipeline: `delete state` (state rm), `create state` (import),
  `move state` (state mv), and `replace_provider state` (state replace-provider).
  `execute workspace` runs a remote plan. For awscdk workspaces, `synth
  workspace` and `diff workspace` run the remote CDK synth and diff.

  ### Nouns

  {{nouns}}

nouns:
  - noun: workspace
    short_desc: An IACM workspace that manages Terraform/OpenTofu infrastructure state.
    noun_aliases: [workspaces]
    url_path: /ng/account/{{auth.account}}/module/iacm/orgs/{{auth.org}}/projects/{{auth.project}}/workspaces/{{it.identifier}}
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
      - id: status
        expr: it.status
      - id: description
        expr: it.description
      - id: repository_path
        expr: it.repository_path
      - id: updated
        expr: epochMs(it.updated)

  - noun: host
    short_desc: An IACM Ansible host tracked across inventories.
    noun_aliases: [hosts]
    fields:
      - id: id
        expr: it.id
      - id: host_address
        expr: it.host_address
      - id: status
        expr: 'it.last_activity != nil ? it.last_activity.status : nil'
      - id: inventories
        expr: it.inventories
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

  - noun: inventory
    short_desc: An IACM Ansible inventory of hosts and groups.
    noun_aliases: [inventories]
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
      - id: type
        expr: it.type
      - id: description
        expr: it.description
      - id: account
        expr: it.account
      - id: org
        expr: it.org
      - id: project
        expr: it.project
      - id: tags
        expr: it.tags
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

  - noun: playbook
    short_desc: An IACM Ansible playbook definition.
    noun_aliases: [playbooks]
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
      - id: description
        expr: it.description
      - id: repository
        expr: it.repository
      - id: repository_branch
        expr: it.repository_branch
      - id: repository_connector
        expr: it.repository_connector
      - id: repository_path
        expr: it.repository_path
      - id: tags
        expr: it.tags
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

  # `module` is already a CLI noun in core.spec.yaml (lists/installs loaded CLI
  # modules). An IaCM registry module is a distinct resource, not a variant of
  # that noun, so per the naming convention (`_` separates words in a distinct
  # base noun; `:` is reserved for noun-variants) it gets its own base noun
  # `registry_module` → `harness list registry_module` / `get registry_module <id>`.
  - noun: registry_module
    short_desc: An IACM Terraform/OpenTofu module from the module registry.
    noun_aliases: [registry_modules]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
      - id: system
        expr: it.system
      - id: namespace
        expr: it.namespace
      - id: description
        expr: it.description
      - id: org
        expr: it.org
      - id: project
        expr: it.project
      - id: repository
        expr: it.repository
      - id: repository_branch
        expr: it.repository_branch
      - id: repository_connector
        expr: it.repository_connector
      - id: versions
        expr: it.versions
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

  - noun: state
    short_desc: A resource tracked in an IACM workspace's Terraform/OpenTofu state.
    noun_aliases: [states]
    fields:
      - id: address
        expr: it.address
      - id: type
        expr: it.type
      - id: provider
        expr: it.provider
      - id: module
        expr: it.module
      - id: mode
        expr: it.mode

  - noun: provider
    short_desc: An IACM Terraform provider from the provider registry.
    noun_aliases: [providers]
    fields:
      - id: id
        expr: it.id
      - id: type
        expr: it.type
      - id: namespace
        expr: it.namespace
      - id: description
        expr: it.description
      - id: domain_prefix
        expr: it.domain_prefix
      - id: account
        expr: it.account
      - id: versions
        expr: it.versions
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

commands:
  - command: list workspace
    verb: list
    noun: workspace
    short: List IACM workspaces in a project
    handler_type: endpoint
    flags:
      - name: search
        description: Filter workspaces by name
    endpoint:
      path: /gateway/iacm/api/orgs/{{auth.org}}/projects/{{auth.project}}/workspaces
      items_expr: it
      get_id_expr: it.identifier
      completion:
        id_expr: it.identifier
        name_expr: it.name
      query_params:
        searchTerm: flags.search
      paging:
        paging_strategy: page_header
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
        total_header: "X-Total-Items"
      columns: [identifier, name, status, updated]

  - command: get workspace
    verb: get
    noun: workspace
    short: Get an IACM workspace by identifier
    completion_noun: workspace
    flags_builtin:
      ui: true
    handler_type: endpoint
    endpoint:
      path: /gateway/iacm/api/orgs/{{auth.org}}/projects/{{auth.project}}/workspaces/{{ctx.id}}
      item_expr: it

  - command: execute workspace
    verb: execute
    noun: workspace
    short: Execute a remote Terraform plan on a workspace
    long: |
      Execute a remote Terraform plan on an IaCM workspace.

      Pass the workspace with --workspace. If that flag is omitted, the command
      reads .harness/workspace.yaml in the current directory:

        org_id:       <your-org>        # optional; overrides --org flag
        project_id:   <your-project>    # optional; overrides --project flag
        workspace_id: <your-workspace>  # required if --workspace is omitted

      Examples:
        harness execute workspace --workspace my-workspace
        harness execute workspace                           # reads .harness/workspace.yaml
        harness execute workspace --workspace my-workspace --target aws_instance.web
        harness execute workspace --workspace my-workspace --force
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: execute_workspace
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: target
        description: "Resource target (can be specified multiple times)"
        is_multi: true
      - name: replace
        description: "Variable replacement in key=value format (can be specified multiple times)"
        is_multi: true
      - name: force
        description: "Skip confirmation prompt"
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  - command: synth workspace
    verb: synth
    noun: workspace
    short: Run a remote CDK synth on an awscdk workspace
    long: |
      Synthesize the CDK app remotely (cdk synth) on an awscdk IaCM workspace.

      Uploads the local source to the workspace and runs the workspace's default
      "synth" pipeline against it. node_modules and cdk.out are not uploaded.

      Pass the workspace with --workspace. If that flag is omitted, the command
      reads .harness/workspace.yaml in the current directory:

        org_id:       <your-org>        # optional; overrides --org flag
        project_id:   <your-project>    # optional; overrides --project flag
        workspace_id: <your-workspace>  # required if --workspace is omitted

      Examples:
        harness synth workspace --workspace my-cdk-workspace
        harness synth workspace                      # reads .harness/workspace.yaml
        harness synth workspace --workspace my-cdk-workspace --follow
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: execute_workspace_synth
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: force
        description: "Skip confirmation prompt"
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  - command: diff workspace
    verb: diff
    noun: workspace
    short: Run a remote CDK diff on an awscdk workspace
    long: |
      Show the CDK diff remotely (cdk diff) on an awscdk IaCM workspace.

      Uploads the local source to the workspace and runs the workspace's default
      "diff" pipeline against it. node_modules and cdk.out are not uploaded.

      Pass the workspace with --workspace. If that flag is omitted, the command
      reads .harness/workspace.yaml in the current directory:

        org_id:       <your-org>        # optional; overrides --org flag
        project_id:   <your-project>    # optional; overrides --project flag
        workspace_id: <your-workspace>  # required if --workspace is omitted

      Examples:
        harness diff workspace --workspace my-cdk-workspace
        harness diff workspace                      # reads .harness/workspace.yaml
        harness diff workspace --workspace my-cdk-workspace --follow
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: execute_workspace_diff
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: force
        description: "Skip confirmation prompt"
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  # ── state ─────────────────────────────────────────────────────────────────────
  - command: list state
    verb: list
    noun: state
    short: List resources in a workspace's current Terraform/OpenTofu state
    long: |
      Lists resources from the workspace resource inventory. When the resources
      table is enabled, that is the table updated after apply and state
      operations. Otherwise the server reads the stored state snapshot.
      No pipeline runs.

      Pass --workspace, or omit it to read .harness/workspace.yaml.
    id_resolve_fn: resolve_state_scope
    handler_type: endpoint
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: search
        description: Filter resources whose address contains this substring
    endpoint:
      fetch_fn: list_state_fetch
      items_expr: it
      get_id_expr: it["address"]
      paging:
        paging_strategy: flat_list
      columns: [address, type, provider, module, mode]

  - command: get state
    verb: get
    noun: state
    short: "Show one resource from a workspace's current state: harness get state <address> --workspace <id>"
    long: |
      Shows a single resource from the workspace resource inventory, with
      sensitive attribute values masked. When the resources table is enabled,
      that is the table updated after apply and state operations. Otherwise
      the server reads the stored state snapshot. No pipeline runs.
      Pass --workspace, or omit it to read .harness/workspace.yaml.
    id_label: "<address>"
    id_allow_slash: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: get_state
    item_fn: get_state_item
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace

  - command: move state
    verb: move
    noun: state
    short: "Move a resource to a new address in a workspace's state: harness move state --workspace <id> --source <addr> --destination <addr>"
    long: |
      Runs 'state mv' on an IACM workspace through its "state" default pipeline
      (workspace override, then project default, then an auto-generated one).

      Pass --workspace, or omit it to read .harness/workspace.yaml.
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: update_state_move
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: source
        description: Current resource address
        required: true
      - name: destination
        description: New resource address
        required: true
      - name: force
        description: Skip confirmation prompt
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  - command: replace_provider state
    verb: replace_provider
    noun: state
    short: "Replace a provider across a workspace's state: harness replace_provider state --workspace <id> --from <provider> --to <provider>"
    long: |
      Runs 'state replace-provider' on an IACM workspace through its "state"
      default pipeline.

      Pass --workspace, or omit it to read .harness/workspace.yaml.
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: update_state_replace_provider
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: from
        description: "Current provider source, e.g. registry.terraform.io/hashicorp/aws"
        required: true
      - name: to
        description: "New provider source, e.g. registry.opentofu.org/hashicorp/aws"
        required: true
      - name: force
        description: Skip confirmation prompt
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  - command: delete state
    verb: delete
    noun: state
    short: "Remove one or more resources from a workspace's state: harness delete state --workspace <id> --address <addr> [--address ...]"
    long: |
      Runs 'state rm' on an IACM workspace through its "state" default pipeline.
      The resource is untracked from state only - it is not destroyed in the
      cloud provider.

      Pass --workspace, or omit it to read .harness/workspace.yaml.
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: delete_state
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: address
        description: "Resource address to remove (can be specified multiple times)"
        is_multi: true
        required: true
      - name: force
        description: Skip confirmation prompt
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  - command: create state
    verb: create
    noun: state
    short: "Import an existing cloud resource into a workspace's state: harness create state --workspace <id> --address <addr> --resource-id <id>"
    long: |
      Runs 'terraform import' on an IACM workspace through its "state" default
      pipeline. The resource must already be declared in the workspace's
      configuration at <address>.

      Pass --workspace, or omit it to read .harness/workspace.yaml.
    no_id: true
    id_resolve_fn: resolve_state_scope
    handler_type: workflow
    workflow_id: create_state
    flags:
      - name: workspace
        description: Workspace identifier. Read from .harness/workspace.yaml when omitted.
        completion_noun: workspace
      - name: address
        description: Resource address to import into, e.g. aws_instance.web
        required: true
      - name: resource-id
        description: Cloud provider identifier of the resource to import
        required: true
      - name: force
        description: Skip confirmation prompt
        is_bool: true
      - name: follow
        description: Stream the pipeline logs live; exits when the execution reaches a terminal state
        is_bool: true
      - name: ui
        description: Open the interactive log viewer for the run (requires a TTY)
        is_bool: true

  # ── host (Ansible) ────────────────────────────────────────────────────────────
  - command: list host
    verb: list
    noun: host
    short: List IACM Ansible hosts at the project level
    handler_type: endpoint
    flags:
      - name: search
        description: Filter hosts by partial host address match
      - name: inventory
        description: Filter hosts by inventory membership
      - name: status
        description: Filter hosts by last activity status
    endpoint:
      path: /gateway/iacm/api/orgs/{{auth.org}}/projects/{{auth.project}}/ansible/hosts
      request_headers:
        Harness-Account: auth.account
      items_expr: it
      get_id_expr: it.id
      completion:
        id_expr: it.id
        name_expr: it.host_address
      query_params:
        searchTerm: flags.search
        inventory: flags.inventory
        status: flags.status
      paging:
        paging_strategy: page_header
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
        total_header: "X-Total-Items"
      columns: [id, host_address, status, updated]

  - command: get host
    verb: get
    noun: host
    short: Get an IACM Ansible host by identifier
    completion_noun: host
    handler_type: endpoint
    endpoint:
      path: /gateway/iacm/api/orgs/{{auth.org}}/projects/{{auth.project}}/ansible/hosts/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it
      yaml_pick_expr: it

